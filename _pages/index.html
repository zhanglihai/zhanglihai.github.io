<h3>
  Yesterday is history, tomorrow is a mystery, but today is a gift. That's why it's called the present.

<div class="img-container">
  <div class="img-slider">
    <img src="https://www.bing.com/th?id=OHR.PlumParakeet_ROW9086396762_1920x1080.webp&qlt=80" height="432" width="768" id="daily_pic"/>
  </div>
</div>

<script>
      try{
          var imgUrlArray=[];
          var xmlhttp = new XMLHttpRequest();
          xmlhttp.onreadystatechange = function() {
          if (this.readyState == 4 && this.status == 200) {
              console.log(this.responseText);
              var imgArray = JSON.parse(this.responseText);
              for(var i=0;i<imgArray.length;i++){
                imgUrlArray.push(imgArray[i].fullUrl);
              }
          }
        };
        xmlhttp.open("GET", "https://peapix.com/bing/feed?country=us", true);
        xmlhttp.send();
        function changePic(){
              if(imgUrlArray.length>0){
                var r=Math.floor(Math.random()*imgUrlArray.length);
                $("#daily_pic").attr("src",imgUrlArray[r]); 
              }
        }
        setInterval(changePic,3000);
      }catch(e){
        console.log(e);
      }
</script>
